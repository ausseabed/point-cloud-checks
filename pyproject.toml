[project]
name = "ausseabed.mbespc"
version = "0.0.1"
description = "Quality Assurance checks for point clouds derived from Multi Beam Echo Sounder data"
requires-python = ">=3.10"
authors = [
  { name = "Josh Sixsmith", email = "joshua.sixsmith@ga.gov.au" },
  { name = "Lachlan Hurst", email = "lachlan.hurst@gmail.com" }
]
dependencies = [
  "Click",
  "ausseabed.qajson",
  "geopandas>=0.14.1",
  "laspy",
  "fiona",
]

[project.scripts]
mbespc = "ausseabed.mbespc.app.cli:cli"

[project.urls]
Homepage = "https://github.com/ausseabed/point-cloud-checks"
Repository = "https://github.com/ausseabed/point-cloud-checks"


[project.optional-dependencies]
test = [
  "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ausseabed"]

[tool.hatch.build.targets.sdist]
packages = ["ausseabed"]